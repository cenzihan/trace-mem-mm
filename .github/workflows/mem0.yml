name: Native Mem0 container validation
on:
  push:
    branches: [main, codex/mem0-night-baseline, codex/native-transport-isolation, codex/mem0-streaming, codex/mem0-source-evidence, codex/mem0-stream-completion, codex/mem0-raw-source, codex/mem0-visual-rerank, codex/hosted-failure-diagnostics]
    paths: ['agent_memory/**', 'tests/**', 'Dockerfile.mem0', 'requirements*.txt', '.github/workflows/mem0.yml', '.dockerignore']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Build pinned native dependency image
        run: docker build -f Dockerfile.mem0 -t tracemem-native:test .
      - name: Real SDK with synthetic models and no network
        run: |
          # The full Windows suite also covers retired msvcrt-only experiment
          # launchers. Linux checks exercise the shipped service and changed code.
          for pattern in test_http2_transport.py test_chat_stream.py test_mem0_native.py test_mem0_evidence.py test_mem0_raw.py test_mem0_visual.py test_bailian_rerank.py test_tls_scope.py test_budget.py test_provider_http.py test_service_transport.py test_service_queue.py test_official_formats.py test_container_app.py test_context_candidate.py; do
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges:true --tmpfs /tmp:mode=1777 \
              --mount "type=bind,src=$GITHUB_WORKSPACE/tests,dst=/app/tests,readonly" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/fixtures,dst=/app/fixtures,readonly" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/scripts,dst=/app/scripts,readonly" \
              tracemem-native:test python -B -m unittest discover -s tests -p "$pattern" -v
          done
