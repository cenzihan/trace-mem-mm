services:
  api:
    build: .
    image: trace-mem-mm:embedding-smoke
    init: true
    restart: "no"
    command: ["gunicorn", "--config", "/app/deploy/gunicorn.conf.py", "agent_memory.embedding_smoke_app:create_app()"]
    ports:
      - "127.0.0.1:8766:8000"
    environment:
      TRACEMEM_SMOKE_ENABLED: embedding-only-approved-grant
      TRACEMEM_SMOKE_STATE: /app/runtime/deployment-embedding-smoke
      TRACEMEM_AUTH_TOKEN_FILE: /run/secrets/smoke_service_token
      TRACEMEM_BAILIAN_TOKEN_FILE: /run/secrets/bailian_token
      TRACEMEM_GRANT_FILE: /run/secrets/embedding_grant
      TRACEMEM_GRANT_SHA256: ${TRACEMEM_GRANT_SHA256:?Provide the approved grant hash}
    secrets:
      - smoke_service_token
      - bailian_token
      - embedding_grant
    volumes:
      - smoke-runtime:/app/runtime
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    stop_grace_period: 130s

secrets:
  smoke_service_token:
    file: ${TRACEMEM_SMOKE_SECRET_DIR:?Provide a private smoke secret directory}/service_token
  bailian_token:
    file: ${TRACEMEM_SMOKE_SECRET_DIR:?Provide a private smoke secret directory}/bailian_token
  embedding_grant:
    file: ${TRACEMEM_SMOKE_SECRET_DIR:?Provide a private smoke secret directory}/grant.json

volumes:
  smoke-runtime:
