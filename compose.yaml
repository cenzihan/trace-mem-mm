services:
  api:
    build: .
    image: ${TRACEMEM_IMAGE:-trace-mem-mm:deterministic-preview}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRACEMEM_PORT:-8765}:8000"
    environment:
      TRACEMEM_MODE: local_deterministic
      TRACEMEM_DB: /data/system.sqlite
      TRACEMEM_AUTH_MODE: Bearer
      TRACEMEM_AUTH_TOKEN_FILE: /run/secrets/tracemem_token
    secrets:
      - tracemem_token
    volumes:
      - memory-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${TRACEMEM_MEMORY_LIMIT:-1g}
    cpus: ${TRACEMEM_CPUS:-2.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 1950s

secrets:
  tracemem_token:
    file: ${TRACEMEM_SECRET_FILE:-./.secrets/service_token}

volumes:
  memory-data:
